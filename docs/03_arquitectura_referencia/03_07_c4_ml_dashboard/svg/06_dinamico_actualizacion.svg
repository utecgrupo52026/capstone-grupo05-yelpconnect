<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1090" width="1400" height="1090" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="C4 · Vista dinámica · Actualización del snapshot"><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5E5E5E"/></marker><marker id="abierta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#5E5E5E" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="30" y="42" font-size="22" font-weight="700" fill="#1A1A1A">C4 · Vista dinámica · Actualización del snapshot</text><text x="30" y="68" font-size="13.5" fill="#555555">Secuencia manual, bajo demanda, que lleva un run nuevo de Databricks hasta el sitio publicado</text><rect x="360" y="668" width="330" height="74" fill="#F3F6FA" stroke="#7A8CA3" stroke-width="1.25" stroke-dasharray="6 3"/><path d="M360 668 h120 v14 l-8 8 h-112 z" fill="#DDE6F0" stroke="#7A8CA3"/><text x="368" y="683" font-size="12" font-weight="700" fill="#2E4057">opt  --publicar</text><line x1="95" y1="166" x2="95" y2="1030" stroke="#9A9A9A" stroke-width="1.25" stroke-dasharray="5 5"/><rect x="20" y="100" width="150" height="66" rx="8" fill="#08427B" stroke="#052E56" stroke-width="1.5"/><text x="95" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Equipo G05</text><text x="95" y="147" text-anchor="middle" font-size="11.5" font-style="italic" opacity="0.9" fill="#FFFFFF">[Persona]</text><line x1="265" y1="166" x2="265" y2="1030" stroke="#9A9A9A" stroke-width="1.25" stroke-dasharray="5 5"/><rect x="190" y="100" width="150" height="66" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="1.5"/><text x="265" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Exportador</text><text x="265" y="147" text-anchor="middle" font-size="11.5" font-style="italic" opacity="0.9" fill="#FFFFFF">[exportar_gold.py]</text><line x1="435" y1="166" x2="435" y2="1030" stroke="#9A9A9A" stroke-width="1.25" stroke-dasharray="5 5"/><rect x="360" y="100" width="150" height="66" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="1.5"/><text x="435" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Motor ML</text><text x="435" y="147" text-anchor="middle" font-size="11.5" font-style="italic" opacity="0.9" fill="#FFFFFF">[ml_anomalias.py]</text><line x1="605" y1="166" x2="605" y2="1030" stroke="#9A9A9A" stroke-width="1.25" stroke-dasharray="5 5"/><rect x="530" y="100" width="150" height="66" rx="8" fill="#8C8C8C" stroke="#6B6B6B" stroke-width="1.5"/><text x="605" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">SQL Warehouse</text><text x="605" y="147" text-anchor="middle" font-size="11.5" font-style="italic" opacity="0.9" fill="#FFFFFF">[Databricks]</text><line x1="775" y1="166" x2="775" y2="1030" stroke="#9A9A9A" stroke-width="1.25" stroke-dasharray="5 5"/><rect x="700" y="100" width="150" height="66" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="1.5"/><text x="775" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Snapshot JSON</text><text x="775" y="147" text-anchor="middle" font-size="11.5" font-style="italic" opacity="0.9" fill="#FFFFFF">[public/data]</text><line x1="945" y1="166" x2="945" y2="1030" stroke="#9A9A9A" stroke-width="1.25" stroke-dasharray="5 5"/><rect x="870" y="100" width="150" height="66" rx="8" fill="#8C8C8C" stroke="#6B6B6B" stroke-width="1.5"/><text x="945" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">GitHub</text><text x="945" y="147" text-anchor="middle" font-size="11.5" font-style="italic" opacity="0.9" fill="#FFFFFF">[rama main]</text><line x1="1115" y1="166" x2="1115" y2="1030" stroke="#9A9A9A" stroke-width="1.25" stroke-dasharray="5 5"/><rect x="1040" y="100" width="150" height="66" rx="8" fill="#8C8C8C" stroke="#6B6B6B" stroke-width="1.5"/><text x="1115" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Netlify</text><text x="1115" y="147" text-anchor="middle" font-size="11.5" font-style="italic" opacity="0.9" fill="#FFFFFF">[build + CDN]</text><line x1="1285" y1="166" x2="1285" y2="1030" stroke="#9A9A9A" stroke-width="1.25" stroke-dasharray="5 5"/><rect x="1210" y="100" width="150" height="66" rx="8" fill="#08427B" stroke="#052E56" stroke-width="1.5"/><text x="1285" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Usuario</text><text x="1285" y="147" text-anchor="middle" font-size="11.5" font-style="italic" opacity="0.9" fill="#FFFFFF">[Navegador]</text><line x1="95" y1="210" x2="263" y2="210" stroke="#5E5E5E" stroke-width="1.5" marker-end="url(#flecha)"/><text x="180.0" y="202.0" text-anchor="middle" font-size="12" fill="#333333" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">1. python exportar_gold.py</text><line x1="265" y1="260" x2="603" y2="260" stroke="#5E5E5E" stroke-width="1.5" marker-end="url(#flecha)"/><text x="435.0" y="252.0" text-anchor="middle" font-size="12" fill="#333333" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">2. Consultas del último run</text><line x1="605" y1="310" x2="267" y2="310" stroke="#5E5E5E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#abierta)"/><text x="435.0" y="302.0" text-anchor="middle" font-size="12" fill="#333333" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">3. Filas agregadas</text><line x1="265" y1="360" x2="773" y2="360" stroke="#5E5E5E" stroke-width="1.5" marker-end="url(#flecha)"/><text x="520.0" y="352.0" text-anchor="middle" font-size="12" fill="#333333" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">4. Escribe 10 JSON (meta … dq)</text><line x1="95" y1="420" x2="433" y2="420" stroke="#5E5E5E" stroke-width="1.5" marker-end="url(#flecha)"/><text x="265.0" y="412.0" text-anchor="middle" font-size="12" fill="#333333" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">5. python ml_anomalias.py</text><line x1="435" y1="470" x2="603" y2="470" stroke="#5E5E5E" stroke-width="1.5" marker-end="url(#flecha)"/><text x="520.0" y="462.0" text-anchor="middle" font-size="12" fill="#333333" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">6. Lee features y riesgo</text><line x1="605" y1="520" x2="437" y2="520" stroke="#5E5E5E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#abierta)"/><text x="520.0" y="512.0" text-anchor="middle" font-size="12" fill="#333333" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">7. 400,000 reseñas</text><path d="M435 556 h40 v24 h-38" fill="none" stroke="#5E5E5E" stroke-width="1.5" marker-end="url(#flecha)"/><text x="483.0" y="572.0" text-anchor="start" font-size="12" fill="#333333" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">8. Entrena Isolation Forest y compara con reglas</text><line x1="435" y1="630" x2="773" y2="630" stroke="#5E5E5E" stroke-width="1.5" marker-end="url(#flecha)"/><text x="605.0" y="622.0" text-anchor="middle" font-size="12" fill="#333333" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">9. Escribe ml_resumen y ml_top</text><line x1="435" y1="715" x2="603" y2="715" stroke="#5E5E5E" stroke-width="1.5" marker-end="url(#flecha)"/><text x="520.0" y="707.0" text-anchor="middle" font-size="12" fill="#333333" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">10. PUT parquet + CREATE TABLE</text><line x1="95" y1="790" x2="943" y2="790" stroke="#5E5E5E" stroke-width="1.5" marker-end="url(#flecha)"/><text x="520.0" y="782.0" text-anchor="middle" font-size="12" fill="#333333" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">11. Commit de public/data y PR a main</text><line x1="945" y1="840" x2="1113" y2="840" stroke="#5E5E5E" stroke-width="1.5" marker-end="url(#flecha)"/><text x="1030.0" y="832.0" text-anchor="middle" font-size="12" fill="#333333" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">12. Webhook: build</text><path d="M1115 876 h40 v24 h-38" fill="none" stroke="#5E5E5E" stroke-width="1.5" marker-end="url(#flecha)"/><text x="1163.0" y="892.0" text-anchor="start" font-size="12" fill="#333333" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">13. npm run build</text><line x1="1285" y1="950" x2="1117" y2="950" stroke="#5E5E5E" stroke-width="1.5" marker-end="url(#flecha)"/><text x="1200.0" y="942.0" text-anchor="middle" font-size="12" fill="#333333" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">14. GET /resumen y data/*.json</text><line x1="1115" y1="1000" x2="1283" y2="1000" stroke="#5E5E5E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#abierta)"/><text x="1200.0" y="992.0" text-anchor="middle" font-size="12" fill="#333333" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">15. Sitio con el snapshot nuevo</text><text x="30" y="1066" font-size="12" fill="#555" font-style="italic">No hay programación automática: el snapshot solo cambia cuando el equipo repite los pasos 1 a 11.</text></svg>